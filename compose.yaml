# Two-service deployment for the log dashboard: the release image plus a
# single-node ClickHouse. No database, cache, or proxy is needed.
#
#   cp .env.example .env   # then fill in the three secrets
#   podman compose up --build
#
# Secrets come from .env (gitignored; .env.example is committed) and are
# interpolated with :? so a missing value aborts before any container starts.
# ClickHouse ports are published on loopback only; the dashboard talks to
# ClickHouse over the compose network by service name.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    # Literal same-port publish needs a listener behind it: the server's
    # defaults are 8123/9000, so override them with positional config args
    # (`clickhouse-server --help`: args after `--` rewrite config.xml).
    # A mounted config file would also work but breaks when the checkout
    # lives on a path the container VM cannot share.
    command: ["--", "--http_port=8124", "--tcp_port=9001"]
    # `CLICKHOUSE_USER` is optional: when set, the server image provisions
    # that user with `CLICKHOUSE_PASSWORD`; when unset, the `default` user
    # keeps the password. The dashboard and the healthcheck below use the
    # same value (defaulting to `default`), so a custom user connects.
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-cluster_log}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      # Loopback only: for host-local inspection and log producers. Never
      # publish these on a routable interface without reading the caveats in
      # README.md first.
      - "127.0.0.1:8124:8124"
      - "127.0.0.1:9001:9001"
    healthcheck:
      # The same authenticated connection the dashboard makes, so wrong
      # credentials report unhealthy here instead of surfacing as a failed
      # schema application. `$$` escapes interpolation so the credentials come
      # from the container's own environment, defaulting to `default` like
      # the dashboard does.
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --host 127.0.0.1 --port 9001 --user \"$${CLICKHOUSE_USER:-default}\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      # ClickHouse's first boot is slow; don't judge it during that window.
      start_period: 30s
    restart: unless-stopped

  dashboard:
    image: logger-dashboard:latest
    build:
      context: .
      dockerfile: Containerfile
    command:
      - /bin/sh
      - -c
      - |
        # `/app/bin/migrate` logs a failed bootstrap but still exits 0, so a
        # plain `migrate && server` would serve traffic against a store whose
        # schema never applied. Call the same entry point and halt on error so
        # a bad password or an unreachable server keeps the service down.
        /app/bin/logger_dashboard eval '
        case ClickhouseExLogger.Utils.migrate() do
          {:ok, _} -> :ok
          {:error, reason} ->
            IO.puts(:stderr, "schema bootstrap failed: " <> inspect(reason))
            System.halt(1)
        end
        ' && exec /app/bin/server
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env - generate with mix phx.gen.secret}
      DASHBOARD_AUTH_TOKEN: ${DASHBOARD_AUTH_TOKEN:?set DASHBOARD_AUTH_TOKEN in .env - generate with mix logger_dashboard.gen.token}
      PHX_HOST: ${PHX_HOST:-localhost}
      # Same var drives the release listen port and both sides of the publish
      # below, so host and container stay literally equal for every override.
      DASHBOARD_PORT: ${DASHBOARD_PORT:-5051}
      # The dashboard authenticates from the URL's userinfo, which
      # `config/runtime.exs` builds from these three values (percent-encoding
      # them, and preserving a `CLICKHOUSE_URL` that already carries userinfo
      # for external servers). AshClickhouse forwards only `:url` to the HTTP
      # client, so the separate user/password never reach the wire on their
      # own — they must meet in the effective URL.
      CLICKHOUSE_URL: http://clickhouse:8124
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-cluster_log}
      # Where the dashboard keeps configuration an operator saves through it —
      # scheduled retention today. On a named volume so a saved policy survives a
      # redeploy rather than reverting to the environment's defaults. The path
      # sits inside /app because the image creates and chowns it for the
      # non-root runtime user; a fresh named volume elsewhere would be
      # root-owned and unwritable.
      TASK_CONFIG_DIR: ${TASK_CONFIG_DIR:-/app/task_config}
    volumes:
      - task-config-data:${TASK_CONFIG_DIR:-/app/task_config}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-5051}:${DASHBOARD_PORT:-5051}"
    healthcheck:
      # Duplicates the Containerfile probe so `podman compose ps` reports it
      # even when the image is built in the default OCI format and the
      # image-level HEALTHCHECK is dropped.
      #
      # 302 is the expected answer: every route sits behind the shared-token gate, and
      # curl sends `Accept: */*`, so an unauthenticated probe is redirected to the
      # token page rather than answered. 401 stays accepted for a client that asks for
      # a non-HTML representation.
      #
      # `$$` escapes compose interpolation so the container shell expands the
      # same `DASHBOARD_PORT` the release listens on.
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://localhost:$${DASHBOARD_PORT:-5051}/logs | grep -qE '^(200|302|401)$' || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  clickhouse-data:
  # Saved dashboard configuration (scheduled retention). `compose down` keeps it;
  # `compose down --volumes` removes it and the dashboard returns to its configured
  # defaults.
  task-config-data:
